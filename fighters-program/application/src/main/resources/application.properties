spring.application.name=fighters-program

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fighters}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fighters}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fighters}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
