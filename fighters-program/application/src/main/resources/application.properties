spring.application.name=fighters-program

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fighters}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fighters}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fighters}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

catalog.import.enabled=${CATALOG_IMPORT_ENABLED:true}
catalog.import.location=${CATALOG_IMPORT_LOCATION:classpath*:catalog/*.json}
catalog.images.location=${CARD_IMAGES_LOCATION:./data/card-images}
catalog.images.seed-location=classpath*:catalog/images/*

# PROVISIONAL game rules until SWD_EN01 (#11) is closed with the DSG: see docs/rules-open-values.md
game.starter-collection.enabled=true

game.deck.size=10
game.deck.max-copies=2
game.deck.max-epic=2
game.deck.max-legendary=1
game.deck.power-budget=18
game.deck.max-per-user=10
game.deck.rarity-points[Comune]=1
game.deck.rarity-points[Rara]=2
game.deck.rarity-points[Epica]=3
game.deck.rarity-points[Leggendaria]=5

game.rules.version=1
game.rules.starting-health=500
game.rules.deck-size=${game.deck.size}
game.rules.faction-bonus-percent=5
game.rules.max-turns=20
game.rules.advanced-faction-bonus=true
game.modes.advanced.enabled=${GAME_ADVANCED_ENABLED:false}

# PROVISIONAL credit values until the DSG confirm them (DSG_MO01): see docs/rules-open-values.md
game.credits.welcome=500
game.credits.match-win=50
game.credits.daily-streak=10,15,20,25,30,40,50

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

identity.jwt.secret=${JWT_SECRET:}
identity.jwt.expiry=1h

identity.admin.email=${ADMIN_EMAIL:}
identity.admin.password=${ADMIN_PASSWORD:}
identity.admin.nickname=${ADMIN_NICKNAME:admin}
